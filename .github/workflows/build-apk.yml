name: Build Sketchware Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply Advanced Developer Mode patch
        run: |
          if [ -f advanced_developer_mode_complete.patch ]; then
            perl -pe 's/\e\[[0-9;]*m//g' advanced_developer_mode_complete.patch > /tmp/advanced_clean.patch
            git apply --exclude='.github/workflows/build-apk.yml' /tmp/advanced_clean.patch

            sed -i 's/protected void onCreate(@Nullable Bundle savedInstanceState)/public void onCreate(@Nullable Bundle savedInstanceState)/' app/src/main/java/pro/sketchware/activities/advanced/AdvancedDeveloperModeActivity.java

            sed -i 's#<string name="link_github_commits_url"#<string formatted="false" name="link_github_commits_url"#' app/src/main/res/values/strings.xml
          else
            echo "No Advanced Developer Mode patch found; building the checked-out source as-is."
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sketchware-pro-advanced-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
